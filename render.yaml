services:
  - type: web
    runtime: static
    name: curiosity-onboarding
    buildCommand: echo "No build step"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    domains:
      - onboarding.curiosity.love
    routes:
      # Client links like /ldv-hospitality and /admin all load the portal.
      # Real files (styles.css, config.js, favicon.svg) are still served directly.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Always fetch the latest client list and code after a push.
      - path: /*
        name: Cache-Control
        value: no-cache
